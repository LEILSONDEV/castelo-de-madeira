<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html,body{margin:0}body{font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Castelo de Madeira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-screen toy table — header strip, then a single SVG stage (castle board above, wooden tray below). */
:root{
  --bg:#cfe9fb; --ink:#1d3768; --wood:#c98e55; --wood-dark:#8a5a2b;
  --sun:#f6b830; --red:#d9443a; --blue:#3d6fd6; --card:#fffaf0;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;transition:background .6s}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:6px}
header{display:flex;align-items:center;gap:8px;padding-block:4px 6px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1rem,4.6vw,1.25rem);line-height:1;margin:0;white-space:nowrap}
.prog{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.bar{flex:1;min-width:40px;height:12px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 2px #9cc5ea;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),#ffd75a);border-radius:99px;transition:width .4s}
#count{font-family:var(--display);font-weight:800;font-size:1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.ib{flex:none;width:38px;height:38px;border-radius:12px;border:0;background:#fff;color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 0 #9cc5ea}
.ib:focus-visible,.btn:focus-visible,.lv:focus-visible,.th:focus-visible,.tab:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ib svg{width:22px;height:22px}
.stage{flex:1;min-height:0;position:relative}
#scene{overflow:hidden;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:10px;background:rgba(29,55,104,.3)}
.card{background:var(--card);border-radius:24px;padding:18px 16px;max-width:380px;width:100%;max-height:100%;display:flex;flex-direction:column;box-shadow:0 6px 0 var(--wood-dark),0 12px 30px rgba(0,0,0,.2);border:3px solid var(--wood)}
.card h2{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.05;margin:0 0 10px;text-align:center;text-wrap:balance}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#f1e3cc;padding:4px;border-radius:14px;margin-bottom:10px}
.tab{font-family:var(--display);font-weight:800;font-size:1rem;border:0;border-radius:11px;padding:8px;background:transparent;color:var(--ink);cursor:pointer}
.tab.on{background:#fff;box-shadow:0 2px 0 #d9c39c}
.hint{margin:0 0 10px;font-size:.95rem;line-height:1.35;text-align:center}
.mpane{min-height:0;display:flex;flex-direction:column}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;overflow-y:auto;min-height:0;padding:2px 2px 6px;max-height:48vh}
.lv{position:relative;aspect-ratio:1;border:0;border-radius:12px;background:var(--c);color:#fff;font-family:var(--display);font-weight:800;font-size:1.05rem;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);font-variant-numeric:tabular-nums;max-width:100%}
.lv i{position:absolute;top:-5px;right:-4px;font-style:normal;color:#ffd23f;font-size:.95rem;text-shadow:0 1px 0 #8a5a00}
.lv.done{opacity:.85}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:.8rem;margin-bottom:8px}
.legend span{display:flex;align-items:center;gap:4px}
.legend b{width:10px;height:10px;border-radius:50%;background:var(--c)}
.themes{display:grid;gap:8px;overflow-y:auto;min-height:0}
.th{display:flex;align-items:center;gap:12px;border:0;border-radius:16px;padding:10px 12px;background:var(--c);color:#fff;cursor:pointer;text-align:left;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.th svg{flex:none;width:44px;height:44px}
.th strong{display:block;font-family:var(--display);font-size:1.15rem;line-height:1.1}
.th small{font-size:.85rem;opacity:.95}
.btn{font-family:var(--display);font-weight:800;font-size:1.1rem;border:0;border-radius:16px;padding:10px 16px;cursor:pointer;color:#fff}
.btn.y{background:var(--sun);color:#4a3000;box-shadow:0 4px 0 #b47c0e}
.btn.b{background:var(--blue);box-shadow:0 4px 0 #24478f}
.btn:active{transform:translateY(3px);box-shadow:none}
.endbar{position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom, 0px));display:flex;gap:10px;justify-content:center;padding-inline:8px}
.ready{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:1.15rem;padding:10px 20px;animation:ready 1.4s ease-in-out infinite}
.ready:active{transform:translateX(-50%) translateY(3px)}
@keyframes ready{0%,100%{scale:1}50%{scale:1.06}}

/* ---------- SVG art ---------- */
.gs{fill:rgba(255,255,255,.42);stroke:rgba(255,255,255,.95);stroke-width:2;stroke-dasharray:6 4}
.ghost.hot .gs{fill:rgba(255,232,140,.8);stroke:#ffbf1f;stroke-width:3;stroke-dasharray:none;animation:pulse .7s ease-in-out infinite alternate}
.ghost.near .gs{fill:rgba(255,220,90,.95);stroke:#ff9d00;stroke-width:3.5}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
[data-tray],[data-pal],[data-pid]{cursor:grab}
.nudge{animation:nudge .5s ease-in-out 3;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px) scale(1.06)}}
.land{animation:land .38s ease-out;transform-box:fill-box;transform-origin:50% 100%}
@keyframes land{0%{transform:scale(1.08,.86)}55%{transform:scale(.96,1.07)}100%{transform:scale(1,1)}}
.wig{animation:wig .4s ease-in-out;transform-box:fill-box;transform-origin:50% 100%}
@keyframes wig{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.pane{fill:var(--pane,#2f4f94);transition:fill .6s}
.alive .pane{fill:var(--lit,#ffd95a);animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.7}}
.flag{opacity:0;transform:scale(0);transform-box:fill-box;transform-origin:50% 100%;transition:transform .5s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.alive .flag{opacity:1;transform:scale(1)}
.cloth{transform-box:fill-box;transform-origin:0 50%}
.alive .cloth{animation:wave .8s ease-in-out infinite alternate}
@keyframes wave{from{transform:scaleX(1) skewY(0)}to{transform:scaleX(.82) skewY(8deg)}}
.door{transform-box:fill-box;transform-origin:0 50%;transition:transform 1.2s ease .6s}
.alive .door{transform:scaleX(.16)}
.al{opacity:0;transition:opacity 2s ease .4s}
.alive .al{opacity:1}
.rays{transform-box:fill-box;transform-origin:50% 50%}
.alive .rays{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{animation:drift 70s linear infinite both}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(560px)}}
.tw{animation:twinkle 2.2s ease-in-out infinite}
#tray{transition:transform .9s cubic-bezier(.6,-0.2,.7,1),opacity .9s}
#tray.gone{transform:translateY(320px);opacity:0;pointer-events:none}
.walkR{animation:walkR linear infinite backwards}
.walkL{animation:walkL linear infinite backwards}
@keyframes walkR{from{transform:translateX(-90px)}to{transform:translateX(490px)}}
@keyframes walkL{from{transform:translateX(490px)}to{transform:translateX(-90px)}}
.bob{animation:bob .45s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
.float{animation:float 1.8s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-9px)}}
.hop{animation:hop .55s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-15px)}}
.legA,.legB{transform-box:fill-box;transform-origin:50% 0}
.legA{animation:swing .3s ease-in-out infinite alternate}
.legB{animation:swing .3s ease-in-out infinite alternate-reverse}
@keyframes swing{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.wave{transform-box:fill-box;transform-origin:50% 100%;animation:hello .6s ease-in-out infinite alternate}
@keyframes hello{from{transform:rotate(-30deg)}to{transform:rotate(25deg)}}
.wag{transform-box:fill-box;transform-origin:0 100%;animation:hello .2s ease-in-out infinite alternate}
.flap{transform-box:fill-box;transform-origin:50% 50%;animation:flap .25s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
.flutter{animation:flutter 3s ease-in-out infinite}
@keyframes flutter{0%{transform:translate(0,0)}25%{transform:translate(18px,-14px)}50%{transform:translate(34px,4px)}75%{transform:translate(14px,12px)}100%{transform:translate(0,0)}}
.blink{animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.beam{animation:beam 2s ease-in-out infinite alternate}
@keyframes beam{from{opacity:.15}to{opacity:.45}}
.shoot{animation:shoot 4s ease-in infinite}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}5%{opacity:1}30%{transform:translate(-220px,110px);opacity:0}100%{opacity:0;transform:translate(-220px,110px)}}
.conf{transform-box:fill-box;transform-origin:50% 50%;animation:fall linear forwards}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(780px) rotate(720deg)}}
.rise{animation:rise 2.4s ease-out forwards}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-120px);opacity:0}}
@media (prefers-reduced-motion: reduce){
  .bob,.hop,.legA,.legB,.wave,.wag,.flutter,.float,.flap,.alive .cloth,.alive .rays,.alive .pane,.tw,.ready{animation:none}
  .cloud{animation-duration:200s}
}
</style>

<body>
<div class="app">
  <header>
    <h1 id="ttl">Castelo de Madeira</h1>
    <div class="prog" id="prog" aria-label="Peças colocadas">
      <div class="bar" id="bar"><i id="barFill"></i></div>
      <span id="count">0/0</span>
    </div>
    <button class="ib" id="themeBtn" aria-label="Trocar mundo" title="Trocar mundo" hidden>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 0 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.4-.5-.8-.5-1.2 0-.9.8-1.7 1.7-1.7H16a5 5 0 0 0 5-5C21 6.3 17 3 12 3zm-5.5 9.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
    </button>
    <button class="ib" id="snd" aria-label="Desligar som" title="Som">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path id="sndWaves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path id="sndOff" d="M17 9l5 6M22 9l-5 6" hidden/></svg>
    </button>
    <button class="ib" id="home" aria-label="Menu" title="Menu">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 21V9l3-2v3h2V5l4-3 4 3v5h2V7l3 2v12h-7v-5a2 2 0 0 0-4 0v5H3z"/></svg>
    </button>
  </header>

  <div class="stage">
    <svg id="scene" viewBox="0 0 400 720" preserveAspectRatio="xMidYMid meet" aria-label="Mesa de montar castelo">
      <defs>
        <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"></linearGradient>
        <linearGradient id="gBody" x1="0" x2="1"></linearGradient>
        <linearGradient id="gBodyV" x1="0" y1="0" x2="0" y2="1"></linearGradient>
        <linearGradient id="gA" x1="0" x2="1"></linearGradient>
        <linearGradient id="gB" x1="0" x2="1"></linearGradient>
        <linearGradient id="gMeadow" x1="0" y1="0" x2="0" y2="1"></linearGradient>
        <linearGradient id="woodG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d79d62"/><stop offset="1" stop-color="#bd8248"/></linearGradient>
        <pattern id="stone" width="22" height="14" patternUnits="userSpaceOnUse"><path id="stoneP" d="M0 .5H22M0 7.5H22M6 0V7M17 7V14" stroke-width="1" fill="none"/></pattern>
        <pattern id="paving" width="26" height="16" patternUnits="userSpaceOnUse"><rect id="paveR" width="26" height="16"/><path id="paveP" d="M0 .5H26M0 8.5H26M8 0V8M21 8V16" stroke-width="1.2" fill="none"/></pattern>
      </defs>

      <rect width="400" height="520" fill="url(#gSky)"/>
      <g id="backdrop"></g>
      <g id="skyfx"></g>
      <g id="hills"></g>
      <path id="mat" d="M22 318 H378 L400 494 H0 Z"/>
      <path id="matEdge" d="M0 494 H400 V506 H0 Z"/>
      <path d="M78 350 H322 L346 476 H54 Z" fill="url(#paving)"/>
      <path id="plazaEdge" d="M78 350 H322 L346 476 H54 Z" fill="none" stroke-width="2"/>
      <g id="bushes"></g>
      <rect y="506" width="400" height="214" fill="url(#gMeadow)"/>
      <path id="road" d="M-10 586 C120 568 280 606 410 584 L410 626 C280 644 120 612 -10 630 Z"/>
      <g id="deco"></g>

      <g id="ghosts"></g>
      <g id="shadows"></g>
      <g id="placed"></g>
      <g id="walkers"></g>
      <g id="fx"></g>

      <g id="tray">
        <rect x="8" y="498" width="384" height="216" rx="22" fill="url(#woodG)" stroke="#8a5a2b" stroke-width="3"/>
        <path d="M24 512 H376 M30 706 H370" stroke="rgba(110,65,25,.18)" stroke-width="2"/>
        <rect x="18" y="534" width="364" height="170" rx="15" fill="#b37841"/>
        <path d="M30 560 Q120 552 200 562 T370 556 M30 640 Q140 632 220 644 T370 636" stroke="rgba(70,40,10,.12)" stroke-width="2" fill="none"/>
        <text id="trayLabel" x="200" y="524" text-anchor="middle" font-family="Baloo 2, Trebuchet MS, sans-serif" font-weight="800" font-size="16" fill="#fff8e6">Escolha um castelo para começar</text>
        <g id="trayPieces"></g>
      </g>
      <g id="dragLayer"></g>
      <g id="confetti"></g>
    </svg>

    <button class="btn y ready" id="readyBtn" hidden>Castelo pronto!</button>

    <div class="overlay" id="menu">
      <div class="card">
        <h2>Vamos montar um castelo?</h2>
        <div class="tabs" role="tablist">
          <button class="tab on" id="tabC" role="tab" aria-selected="true">120 Desafios</button>
          <button class="tab" id="tabF" role="tab" aria-selected="false">Montar livre</button>
        </div>
        <div class="mpane" id="paneC">
          <p class="hint">Encaixe cada peça no contorno do mesmo formato. Cada cor é um mundo diferente.</p>
          <div class="legend" id="legend"></div>
          <div class="grid" id="levels"></div>
        </div>
        <div class="mpane" id="paneF" hidden>
          <p class="hint">Monte do seu jeito e aperte “Castelo pronto!”. Quem vai morar no castelo?</p>
          <div class="themes" id="themes"></div>
        </div>
      </div>
    </div>
    <div class="endbar" id="endbar" hidden>
      <button class="btn b" id="endA">Próximo castelo</button>
      <button class="btn y" id="endB">Menu</button>
    </div>
  </div>
</div>

}
function cren(w,h,n,mh){const seg=w/n;let d=`M${-w/2} 0 V${-h}`;
  for(let i=0;i<n;i++){const y=(i%2===0)?-h:-h+mh; if(i>0)d+=` V${y}`; d+=` H${(-w/2+(i+1)*seg).toFixed(1)}`;}
  return d;}
function winEl(y){return `<g transform="translate(0 ${y})"><path d="M-7.5 10V-2A7.5 7.5 0 0 1 7.5-2V10Z" fill="${T.frame}" stroke="${T.frameS}" stroke-width="1.2"/><path class="pane" d="M-4.6 7.6V-1.6A4.6 4.6 0 0 1 4.6-1.6V7.6Z"/><path d="M0-6V7.6M-4.6 2H4.6" stroke="${T.frame}" stroke-width="1.2"/></g>`;}

function art(key,ghost){
  if(key.startsWith('tower')){
    const h=DIM[key],r=26,body=`M${-r} ${-h}V0A${r} 7 0 0 0 ${r} 0V${-h}Z`;

    for(let y=-h+28;y<-14;y+=38) s+=winEl(y);
    return s;
  }
  if(key==='wall'){
    const d=cren(64,46,7,9)+' V0 Z';
    if(ghost) return `<path d="${d}" class="gs"/>`;
    return `<path d="${d}" fill="url(#gBodyV)"/><path d="${d}" fill="url(#stone)"/><path d="${d}" fill="none" stroke="${T.stroke}" stroke-width="1.6"/>
      <g transform="translate(0 -18)"><path d="M-7-8H7V0Q7 7 0 10Q-7 7-7 0Z" fill="#fff" stroke="${T.frameS}" stroke-width="1.2"/><path d="M0-6V8M-5-1H5" stroke="${T.shield}" stroke-width="2.6"/></g>`;
  }
  if(key==='gate'){
    const d=cren(54,68,5,9)+' V0 Z', door='M-15 0V-28A15 15 0 0 1 15-28V0Z';

      ${flag(-68,26,T.flags[2])}`;

  if(key==='cone'){

  }

    return `${flag(-32,28,T.flags[1])}<path d="${d}" fill="url(#gB)" stroke="${T.Bs}" stroke-width="1.6"/><path d="M-29-23H29" stroke="rgba(0,0,0,.15)" stroke-width="1.5"/>`;
  }
  if(key==='dome'){
    const d='M-27 0C-29-22-14-30-2-48Q0-53 2-48C14-30 29-22 27 0C14 6-14 6-27 0Z';
    if(ghost) return `<path d="${d}" class="gs"/>`;

  }
  return '';
}

/* ================= 120 challenge castles ================= */
const LEVELS=120;
const BASEY={tower210:404,tower150:416,tower100:430,tower60:446,wall:444,gate:452};
function genLevel(n){
  const r=rnd(n*9973+7), pick=a=>a[Math.floor(r()*a.length)];
  const topPick=()=>n<6?pick(['cone','cap']):pick(['cone','cap','dome','cone']);
  const out=[]; const push=(key,x,top)=>out.push({key,x,y:BASEY[key],top});
  const pairs=n<=8?1:n<=35?2:n<=70?(r()<.5?2:3):3;
  const center=n<=3?'tower150':pick(['tower210','tower150','tower210','tower100']);
  push(center,200,topPick());
  const dxs=pairs===1?[pick([66,82,96])]:pairs===2?[pick([58,66]),pick([118,134,150])]:[54,104,154];
  let prev=DIM[center];
  dxs.forEach(dx=>{const opts=['tower210','tower150','tower100','tower60'].filter(k=>DIM[k]<=prev+(r()<.3?60:0));
    const k=pick(opts.length?opts:['tower100']); prev=DIM[k]; const t=(n<5||r()<.85)?topPick():null;
    push(k,200-dx,t); push(k,200+dx,t);});
  if(n>3&&r()<.75) push('gate',200,null);
  if(n>8&&dxs.length>=2){for(let i=0;i<dxs.length-1;i++) if(r()<.7){const m=(dxs[i]+dxs[i+1])/2; push('wall',200-m,null); push('wall',200+m,null);}}
  else if(n>3&&dxs.length===1&&r()<.6){const m=dxs[0]/2+4; push('wall',200-m,null); push('wall',200+m,null);}
  if(n>60&&r()<.5){const m=dxs[dxs.length-1]+(dxs.length===3?0:44); if(m<=160){push('tower60',200-m,topPick());push('tower60',200+m,topPick());}}
  return out;
}
function buildSlots(n){
  const bodies=genLevel(n); const slots=[];
  bodies.forEach((b,i)=>{const z=b.y*100-Math.abs(b.x-200)*.01; slots.push({id:'b'+i,key:b.key,x:b.x,y:b.y,z,phase:1,filled:false});
    if(b.top){const ty=b.y-DIM[b.key]+({cone:5,cap:8,dome:6}[b.top]); slots.push({id:'t'+i,key:b.top,x:b.x,y:ty,z:z+50,phase:2,filled:false});}});
  return slots;
}

function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(ac&&ac.state==='suspended')ac.resume(); return ac;}
function tone(f,dur,type,vol,when,slide){const a=audio(); if(!a||muted)return; const t=a.currentTime+(when||0);
  const o=a.createOscillator(),g=a.createGain(); o.type=type||'triangle'; o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.15,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.03);}

const easeOut=k=>1-Math.pow(1-k,3);

function tween(n,a,b,dur,done){const t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/dur),e=easeOut(k);
    n.setAttribute('transform',`translate(${a.x+(b.x-a.x)*e} ${a.y+(b.y-a.y)*e}) scale(${a.s+(b.s-a.s)*e})`);
    if(k<1)requestAnimationFrame(f); else if(done)done();})(t0);}

  if(G.mode!=='challenge')return;
  G.slots.filter(s=>s.phase===G.phase&&!s.filled).forEach(s=>{
    const n=node(art(s.key,true)); n.setAttribute('class','ghost'); n.setAttribute('transform',`translate(${s.x} ${s.y})`); n.dataset.slot=s.id; g.appendChild(n);});}
function ghostEl(id){return $('ghosts').querySelector(`[data-slot="${id}"]`);}
function drawTray(){const g=$('trayPieces'); g.innerHTML='';
  if(G.mode==='free'){
    PALETTE.forEach((k,i)=>{const h=DIM[k]; const o=document.createElementNS(NS,'g'); o.dataset.pal=k;
      o.setAttribute('transform',`translate(${PAL_X(i)} ${TRAY_Y}) scale(${k.startsWith('tower')?PAL_S:.6})`);
      o.innerHTML=`<rect x="-40" y="${-Math.max(h,90)-30}" width="80" height="${Math.max(h,90)+50}" fill="#000" fill-opacity="0"/><g>${art(k)}</g>`; g.appendChild(o);});
    return;}
  G.tray.forEach((p,i)=>{if(!p)return; const h=DIM[p.key];
    const o=document.createElementNS(NS,'g'); o.dataset.tray=i;
    o.setAttribute('transform',`translate(${TRAY_X[i]} ${TRAY_Y}) scale(${TRAY_S})`);
    o.innerHTML=(selected===i?`<ellipse cy="4" rx="48" ry="12" fill="#ffe27a" opacity=".8"/>`:'')+`<rect x="-62" y="${-h-24}" width="124" height="${h+44}" fill="#000" fill-opacity="0"/><g>${art(p.key)}</g>`;
    g.appendChild(o);});}
function fillTray(){for(let i=0;i<4;i++){if(!G.tray[i]&&G.queue.length)G.tray[i]=G.queue.shift();} drawTray();}

/* ================= game setup ================= */
function resetScene(){
  clearTimers(); stopMusic(); hush();
  svg.classList.remove('alive'); const tr=$('tray'); tr.style.transition='none'; tr.classList.remove('gone'); void tr.getBBox(); tr.getBoundingClientRect(); requestAnimationFrame(()=>{tr.style.transition='';}); $('endbar').hidden=true; $('readyBtn').hidden=true;
  ['placed','shadows','walkers','confetti','skyfx','dragLayer','fx','ghosts'].forEach(id=>$(id).innerHTML='');
  selected=null; drag=null;
}
function startChallenge(n){
  resetScene(); applyTheme(themeOfLevel(n));
  G={mode:'challenge',level:n,phase:1,slots:buildSlots(n),pieces:[],tray:[null,null,null,null],queue:[],done:false,nextId:1};
  $('ttl').textContent='Nível '+n; $('themeBtn').hidden=true;
  startPhase(1,true); progress(); renderPlaced();
}
function startFree(ti){
  resetScene(); applyTheme(ti);
  G={mode:'free',theme:ti,pieces:[],done:false,nextId:1};
  $('ttl').textContent='Montar livre'; $('themeBtn').hidden=false;
  drawGhosts(); drawTray(); renderPlaced(); progress(); updateReady();
  setLabel('Arraste as peças. Para apagar, traga aqui.');
  speak(T.hello+' Monte o castelo do seu jeito. Quando terminar, aperte castelo pronto.');
}
function updateReady(){$('readyBtn').hidden=!(G&&G.mode==='free'&&!G.done&&G.pieces.length>=2);}
function startPhase(ph,first){
  G.phase=ph; G.tray=[null,null,null,null];
  G.queue=shuffle(G.slots.filter(s=>s.phase===ph).map(s=>({key:s.key})));
  drawGhosts(); fillTray();
  if(ph===1){setLabel('Arraste as peças para os contornos'); if(first)speak(T.hello+' Nível '+G.level+'. Arraste cada peça para o lugar com o mesmo formato.');}
  else{setLabel('Agora os telhados!'); sfx.phase(); speak('Muito bem! Agora coloque os telhados em cima das torres.',true);}
  armHint();
}

/* ================= challenge logic ================= */
function freeSlotsFor(key){return G.slots.filter(s=>s.phase===G.phase&&!s.filled&&s.key===key);}
function nearestSlot(key,x,y){let best=null,bd=1e9;
  freeSlotsFor(key).forEach(s=>{const d=Math.hypot(s.x-x,(s.y-y)*.8); if(d<bd){bd=d;best=s;}});
  return bd<85?best:null;}
function clearHot(){$('ghosts').querySelectorAll('.hot,.near').forEach(g=>g.classList.remove('hot','near'));}
function hotFor(key){clearHot(); freeSlotsFor(key).forEach(s=>{const g=ghostEl(s.id); if(g)g.classList.add('hot');});}
function commit(slot,trayIdx,fromNode){
  slot.filled=true; G.tray[trayIdx]=null; selected=null;
  if(fromNode)fromNode.remove();
  const id=G.nextId++; G.pieces.push({id,key:slot.key,x:slot.x,y:slot.y,z:slot.z,shadow:slot.phase===1});
  renderPlaced(id); drawGhosts(); clearHot(); sfx.place();
  const n=G.slots.filter(s=>s.filled).length; progress();
  speak(NUM[n-1]?NUM[n-1]+'!':'Isso!');
  const left=G.slots.filter(s=>s.phase===G.phase&&!s.filled).length;
  if(left===0){if(G.phase===1){const ph2=G.slots.some(s=>s.phase===2); if(ph2)later(()=>startPhase(2),650); else finish();} else finish();}
  else{fillTray(); setLabel(G.phase===1?'Isso! Continue montando':'Mais um telhado!');}
  armHint();
}
function flyFromTray(i,slot){
  const p=G.tray[i]; const n=node(art(p.key)); $('dragLayer').appendChild(n);
  const tp=$('trayPieces').querySelector(`[data-tray="${i}"]`); if(tp)tp.style.visibility='hidden';
  tween(n,{x:TRAY_X[i],y:TRAY_Y,s:TRAY_S},{x:slot.x,y:slot.y,s:1},380,()=>commit(slot,i,n));
}
function armHint(){clearTimeout(hintT); if(!G||G.done||G.mode!=='challenge')return;
  hintT=setTimeout(()=>{if(drag||!G||G.done)return; const i=G.tray.findIndex(Boolean); if(i<0)return;
    const tp=$('trayPieces').querySelector(`[data-tray="${i}"]`); if(tp&&tp.lastChild){tp.lastChild.classList.add('nudge'); setTimeout(()=>tp.lastChild&&tp.lastChild.classList.remove('nudge'),1600);}
    if(selected===null){hotFor(G.tray[i].key); setTimeout(()=>{if(selected===null&&!drag)clearHot();},2200);}
    armHint();},8000);}

/* ================= free-build logic ================= */
const SEAT={cone:5,cap:8,dome:6,tower210:6,tower150:6,tower100:6,tower60:6,wall:3,gate:3};
function surface(p){if(p.key.startsWith('tower'))return p.y-DIM[p.key]; return {wall:p.y-40,gate:p.y-62,cap:p.y-26}[p.key]??null;}
function subtree(id){const out=new Set([id]);let grew=true;while(grew){grew=false;G.pieces.forEach(p=>{if(p.parent&&out.has(p.parent)&&!out.has(p.id)){out.add(p.id);grew=true;}});}return out;}
function placeFor(key,x,baseY,ex){
  let best=null,bd=1e9;
  G.pieces.forEach(p=>{if(ex&&ex.has(p.id))return; const s=surface(p); if(s==null)return;
    const dx=Math.abs(x-p.x); if(dx>HW[p.key]+14)return;
    const target=s+SEAT[key]; if(baseY<target-130||baseY>target+45)return;
    const d=dx+Math.abs(baseY-target)*.6; if(d<bd){bd=d;best=p;}});
  if(best)return {x:best.x,y:surface(best)+SEAT[key],parent:best.id};
  return {x:clamp(x,28,372),y:clamp(baseY,398,478),parent:null};
}
function rez(){ // recompute z for all pieces from their stacks
  const byId=new Map(G.pieces.map(p=>[p.id,p]));
  const info=p=>{let d=0,root=p;while(root.parent&&byId.has(root.parent)){root=byId.get(root.parent);d++;} return {g:root.y,d};};
  G.pieces.forEach(p=>{const {g,d}=info(p); p.z=g*100+d*1+(p.parent?0:-Math.abs(p.x-200)*.001); p.shadow=!p.parent;});
}
function addFree(key,x,baseY,fromNode){
  if(G.pieces.length>=90){speak('O castelo já está enorme!'); if(fromNode)fromNode.remove(); return;}
  const pl=placeFor(key,x,baseY,null);
  const done=()=>{if(fromNode)fromNode.remove(); const id=G.nextId++; G.pieces.push({id,key,x:pl.x,y:pl.y,parent:pl.parent}); rez(); renderPlaced(id); sfx.place(); progress(); updateReady();};
  if(fromNode)tween(fromNode,{x,y:baseY,s:1.06},{x:pl.x,y:pl.y,s:1},Math.abs(pl.y-baseY)>30?260:120,done); else done();
}

/* ================= input ================= */
svg.addEventListener('pointerdown',e=>{
  if(!G||G.done)return; armHint(); const p=pt(e);
  if(G.mode==='free'){
    const pal=e.target.closest('[data-pal]'), pc=e.target.closest('[data-pid]');
    if(pal){e.preventDefault(); drag={kind:'new',key:pal.dataset.pal,sx:p.x,sy:p.y,moved:false,id:e.pointerId}; try{svg.setPointerCapture(e.pointerId);}catch(_){} return;}
    if(pc){e.preventDefault(); const pid=+pc.dataset.pid, piece=G.pieces.find(q=>q.id===pid);
      drag={kind:'move',piece,sx:p.x,sy:p.y,offX:p.x-piece.x,offY:p.y-piece.y,moved:false,id:e.pointerId}; try{svg.setPointerCapture(e.pointerId);}catch(_){} return;}
    return;
  }
  const tp=e.target.closest('[data-tray]'), gh=e.target.closest('.ghost');
  if(tp){e.preventDefault(); const i=+tp.dataset.tray;
    drag={kind:'tray',i,key:G.tray[i].key,sx:p.x,sy:p.y,moved:false,id:e.pointerId}; try{svg.setPointerCapture(e.pointerId);}catch(_){} return;}
  if(selected!==null&&G.tray[selected]){const key=G.tray[selected].key,h=DIM[key]; let best=null,bd=1e9;
    freeSlotsFor(key).forEach(s=>{if(Math.abs(p.x-s.x)<40&&p.y>s.y-h-14&&p.y<s.y+14){const d=Math.abs(p.x-s.x)+Math.abs(p.y-(s.y-h/2))*.5; if(d<bd){bd=d;best=s;}}});
    if(best)flyFromTray(selected,best); else if(gh||p.y<500){sfx.miss(); speak('Hmm, essa peça não encaixa aí. Procure o lugar brilhante!');}}
});
svg.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return; const p=pt(e);
  if(!drag.moved&&Math.hypot(p.x-drag.sx,p.y-drag.sy)>6){
    drag.moved=true;
    if(drag.kind==='move'){drag.set=subtree(drag.piece.id); drag.orig=G.pieces.filter(q=>drag.set.has(q.id)).map(q=>({q,x:q.x,y:q.y})); drag.orig.forEach(o=>$('placed').appendChild(o.q.el)); sfx.pick(); speak(nameOf(drag.piece.key)); setLabel('Solte aqui embaixo para apagar');}
    else{ if(drag.kind==='tray'){selected=null; drawTray(); const el=$('trayPieces').querySelector(`[data-tray="${drag.i}"]`); if(el)el.style.visibility='hidden'; hotFor(drag.key);}
      drag.node=node(art(drag.key)); $('dragLayer').appendChild(drag.node); drag.off=DIM[drag.key]*.55; sfx.pick(); speak(nameOf(drag.key)); setLabel(nameOf(drag.key));}
  }
  if(!drag.moved)return;
  if(drag.kind==='move'){const dx=p.x-drag.offX-drag.piece.x, dy=p.y-drag.offY-drag.piece.y;
    drag.orig.forEach(o=>o.q.el.setAttribute('transform',`translate(${o.x+dx} ${o.y+dy})`));
    drag.cx=p.x-drag.offX; drag.cy=p.y-drag.offY; drag.py=p.y; return;}
  const x=p.x,y=p.y+drag.off; drag.x=x; drag.y=y; drag.py=p.y;
  drag.node.setAttribute('transform',`translate(${x} ${y}) scale(1.06)`);
  if(drag.kind==='tray'){$('ghosts').querySelectorAll('.near').forEach(g=>g.classList.remove('near'));
    const s=nearestSlot(drag.key,x,y); if(s){const g=ghostEl(s.id); if(g)g.classList.add('near');}}
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return; const d=drag; drag=null;
  if(d.kind==='new'){
    if(!d.moved){speak(nameOf(d.key)+'. Arraste até o castelo.'); setLabel(nameOf(d.key)); return;}
    if(d.py>500){d.node.remove(); setLabel('Arraste as peças. Para apagar, traga aqui.'); return;}
    addFree(d.key,d.x,d.y,d.node); setLabel('Arraste as peças. Para apagar, traga aqui.'); return;}
  if(d.kind==='move'){
    if(!d.moved){const inner=d.piece.el.firstChild; inner.classList.remove('wig'); void inner.getBBox(); inner.classList.add('wig'); speak(nameOf(d.piece.key)); return;}
    const root=d.piece; setLabel('Arraste as peças. Para apagar, traga aqui.');
    if(d.py>500){G.pieces=G.pieces.filter(q=>!d.set.has(q.id)); sfx.poof(); rez(); renderPlaced(); progress(); updateReady(); return;}
    const pl=placeFor(root.key,d.cx,d.cy,d.set); const dx=pl.x-root.x, dy=pl.y-root.y;
    G.pieces.forEach(q=>{if(d.set.has(q.id)){q.x+=dx;q.y+=dy;}}); root.parent=pl.parent; rez(); renderPlaced(root.id); sfx.place(); return;}
  // challenge tray
  if(!d.moved){
    if(selected===d.i){selected=null;clearHot();drawTray();setLabel('Arraste as peças para os contornos');return;}
    selected=d.i; drawTray(); hotFor(d.key); sfx.pick(); setLabel(nameOf(d.key)); speak(nameOf(d.key)+'. Toque no lugar brilhante.'); return;}
  const s=nearestSlot(d.key,d.x,d.y);
  if(s)tween(d.node,{x:d.x,y:d.y,s:1.06},{x:s.x,y:s.y,s:1},120,()=>commit(s,d.i,d.node));
  else{sfx.miss(); clearHot(); setLabel('Quase! Leve até o contorno igual');
    tween(d.node,{x:d.x,y:d.y,s:1.06},{x:TRAY_X[d.i],y:TRAY_Y,s:TRAY_S},320,()=>{d.node.remove(); drawTray();});}
}
svg.addEventListener('pointerup',endDrag);
svg.addEventListener('pointercancel',endDrag);

/* ================= the castle comes alive ================= */
function confetti(){const c=$('confetti'),cols=['#ff6b6b','#ffd23f','#4dabf7','#69db7c','#f783ac','#ffa94d'];
  const n=matchMedia('(prefers-reduced-motion: reduce)').matches?14:60; let h='';
  for(let i=0;i<n;i++){const x=Math.random()*400,y=-20-Math.random()*120,dur=2.6+Math.random()*2.4,dl=Math.random()*1.2,col=cols[i%cols.length];
    h+=i%3===0?`<path class="conf" style="animation-duration:${dur}s;animation-delay:${dl}s" transform="translate(${x} ${y})" d="M0-6L1.8-1.8L6 0L1.8 1.8L0 6L-1.8 1.8L-6 0L-1.8-1.8Z" fill="${col}"/>`
      :`<rect class="conf" style="animation-duration:${dur}s;animation-delay:${dl}s" x="${x}" y="${y}" width="6" height="10" rx="1.5" fill="${col}"/>`;}
  c.innerHTML=h; later(()=>{c.innerHTML='';},6500);}
function hearts(cx,cy){const cols=['#ff6b9a','#ffd23f','#ff8c42','#b197fc',T.lit];let h='';
  for(let i=0;i<14;i++){const x=cx+(Math.random()-.5)*160,y=cy+(Math.random()-.5)*60,s=.7+Math.random()*.7;
    h+=`<g transform="translate(${x|0} ${y|0}) scale(${s.toFixed(2)})"><path class="rise" style="animation-delay:${(Math.random()*.8).toFixed(2)}s" d="M0 6C-10-2-8-10-3-10C-1-10 0-8 0-7C0-8 1-10 3-10C8-10 10-2 0 6Z" fill="${cols[i%cols.length]}"/></g>`;}
  const g=node(h); $('fx').appendChild(g); later(()=>g.remove(),3600);}
function entrance(){
  const ps=G.pieces; const gates=ps.filter(p=>p.key==='gate').sort((a,b)=>b.y-a.y||Math.abs(a.x-200)-Math.abs(b.x-200));
  if(gates.length)return {x:gates[0].x,y:gates[0].y-2,gate:true};
  const bodies=ps.filter(p=>!p.parent).sort((a,b)=>b.y-a.y||Math.abs(a.x-200)-Math.abs(b.x-200));
  const b=bodies[0]||{x:200,y:440}; return {x:b.x,y:b.y-2,gate:false};
}
function top(){let m=480,x=200;G.pieces.forEach(p=>{const t=p.y-DIM[p.key];if(t<m){m=t;x=p.x;}});return {x,y:m};}
const scaleAt=y=>y>=600?1.15:.62+Math.max(0,(y-440))/160*.53;
function moveAlong(g,pts,speed,done){let i=0,x=pts[0][0],y=pts[0][1],last=performance.now();
  const apply=()=>g.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${scaleAt(y).toFixed(3)})`);
  apply();
  (function f(t){if(!g.isConnected)return; const dt=Math.min(50,t-last)/1000; last=t; const [tx,ty]=pts[i+1]; const dx=tx-x,dy=ty-y,dd=Math.hypot(dx,dy),step=speed*dt;
    if(dd<=step){x=tx;y=ty;i++; apply(); if(i>=pts.length-1)return done&&done();} else {x+=dx/dd*step;y+=dy/dd*step; apply();}
    requestAnimationFrame(f);})(last);}
function enterCastle(){
  const door=entrance(), cast=CAST[T.id], lay=$('walkers');
  speak(T.finale,true);
  cast.pair.forEach((html,k)=>{
    later(()=>{const g=node(html); lay.appendChild(g); g.style.transition='opacity .6s';
      const lane=612+k*18, xEnd=door.x-(k?10:0);
      moveAlong(g,[[-40,lane],[xEnd,lane],[door.x,door.y+6]],95,()=>{g.style.opacity='0'; sfx.enter(); later(()=>g.remove(),700);
        if(k===cast.pair.length-1){const t=top(); later(()=>{hearts(t.x,Math.max(140,t.y+40)); speak(T.after,true);},400);
          later(()=>{$('endbar').hidden=false;},1600);}});},k*1100);
  });
}
function finish(){
  G.done=true; clearTimeout(hintT); $('readyBtn').hidden=true; setLabel('Castelo pronto!');
  sfx.win(); confetti(); speak('Castelo pronto! Que lindo!');
  if(G.mode==='challenge') markDone(G.level);
  $('endA').textContent=G.mode==='challenge'?(G.level<LEVELS?'Próximo castelo':'Recomeçar'):'Continuar montando';
  later(()=>{svg.classList.add('alive'); $('tray').classList.add('gone'); $('ghosts').innerHTML='';
    const c=CAST[T.id]; $('walkers').innerHTML=c.ground(); $('skyfx').innerHTML=c.sky(); startMusic();
    later(enterCastle,900);},1200);
}

/* ================= menu ================= */
function getDone(){try{return new Set(JSON.parse(localStorage.getItem('castelo-feitos')||'[]'));}catch(e){return new Set();}}
function markDone(n){const s=getDone(); s.add(n); try{localStorage.setItem('castelo-feitos',JSON.stringify([...s]));}catch(e){}}
function buildMenu(){
  const done=getDone();
  $('levels').innerHTML=Array.from({length:LEVELS},(_,i)=>{const n=i+1,th=THEMES[themeOfLevel(n)];
    return `<button class="lv${done.has(n)?' done':''}" style="--c:${th.ui}" data-lv="${n}" aria-label="Nível ${n}, ${th.name}">${n}${done.has(n)?'<i>★</i>':''}</button>`;}).join('');
  $('legend').innerHTML=THEMES.map(t=>`<span><b style="--c:${t.ui}"></b>${t.name}</span>`).join('');
  $('themes').innerHTML=THEMES.map((t,i)=>`<button class="th" style="--c:${t.ui}" data-th="${i}"><svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="${t.sky[1]}"/><path d="M12 34V18h6v16zM26 34V18h6v16z" fill="${t.body[1]}" stroke="${t.stroke}"/><path d="M11 18l4-9 4 9zM25 18l4-9 4 9z" fill="${t.A[1]}" stroke="${t.As}"/><rect x="17" y="24" width="10" height="10" fill="${t.bodyV[1]}" stroke="${t.stroke}"/></svg><span><strong>${t.name}</strong><small>${t.who}</small></span></button>`).join('');
}
function openMenu(){resetScene(); G=null; buildMenu(); $('menu').hidden=false; $('ttl').textContent='Castelo de Madeira'; $('themeBtn').hidden=true; preview();}
function tab(free){$('tabC').classList.toggle('on',!free);$('tabF').classList.toggle('on',free);$('tabC').setAttribute('aria-selected',!free);$('tabF').setAttribute('aria-selected',free);$('paneC').hidden=free;$('paneF').hidden=!free;}
$('tabC').onclick=()=>tab(false); $('tabF').onclick=()=>tab(true);
$('levels').addEventListener('click',e=>{const b=e.target.closest('[data-lv]'); if(!b)return; audio(); pickVoice(); $('menu').hidden=true; startChallenge(+b.dataset.lv);});
$('themes').addEventListener('click',e=>{const b=e.target.closest('[data-th]'); if(!b)return; audio(); pickVoice(); $('menu').hidden=true; startFree(+b.dataset.th);});
$('endA').onclick=()=>{
  if(G.mode==='challenge'){startChallenge(G.level<LEVELS?G.level+1:1);return;}
  clearTimers(); stopMusic(); hush(); svg.classList.remove('alive'); $('tray').classList.remove('gone'); $('endbar').hidden=true;
  ['walkers','skyfx','fx','confetti'].forEach(id=>$(id).innerHTML=''); G.done=false; updateReady(); setLabel('Arraste as peças. Para apagar, traga aqui.');};
$('endB').onclick=openMenu;
$('home').onclick=openMenu;
$('readyBtn').onclick=()=>{if(G&&G.mode==='free'&&G.pieces.length)finish();};
$('themeBtn').onclick=()=>{if(!G||G.mode!=='free')return; G.theme=(G.theme+1)%THEMES.length; applyTheme(G.theme); renderPlaced(); drawTray();
  if(G.done){stopMusic(); const c=CAST[T.id]; $('walkers').innerHTML=c.ground(); $('skyfx').innerHTML=c.sky(); startMusic();}
  speak('Agora é o '+T.name+'!'); setLabel(T.name);};
$('snd').onclick=()=>{muted=!muted; $('sndWaves').hidden=muted; $('sndOff').hidden=!muted;
  $('snd').setAttribute('aria-label',muted?'Ligar som':'Desligar som');
  if(muted){stopMusic(); hush();} else if(G&&G.done&&svg.classList.contains('alive'))startMusic();};
if('speechSynthesis' in window){try{speechSynthesis.onvoiceschanged=()=>{voice=null;pickVoice();};}catch(e){}}

/* preview behind the menu: a finished castle */
function preview(){applyTheme(0); G={mode:'preview',slots:buildSlots(64),pieces:[],done:true};
  G.slots.forEach((s,i)=>G.pieces.push({id:i+1,key:s.key,x:s.x,y:s.y,z:s.z,shadow:s.phase===1})); renderPlaced(); $('count').textContent=''; $('bar').hidden=true; setLabel('Escolha um castelo para começar'); $('trayPieces').innerHTML='';}

buildMenu(); preview();
})();
</script>
